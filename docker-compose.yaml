services:
  aind-metadata-service-local:
    build: ./aind-metadata-service-server
    ports:
      - "5000:80"
    expose:
      - "5000"
    depends_on:
      - labtracks
      - mgi
      - smartsheet
      - sharepoint
      - tars
      - dataverse
      - redis
      - active_directory
      - orcid
      - aind_metadata_service_v1
    env_file: "env/webapp.env"
  labtracks:
    image: "ghcr.io/allenneuraldynamics/aind-labtracks-service-server:0.5.0"
    env_file: "env/labtracks.env"
  mgi:
    image: "ghcr.io/allenneuraldynamics/aind-mgi-service-server:0.2.3"
  orcid:
    image: "ghcr.io/allenneuraldynamics/orcid-service-server:0.1.0"
  smartsheet:
    image: "ghcr.io/allenneuraldynamics/aind-smartsheet-service-server:1.1.0"
    env_file: "env/smartsheet.env"
  sharepoint:
    image: "ghcr.io/allenneuraldynamics/aind-sharepoint-service-server:0.3.0"
    env_file: "env/sharepoint.env"
  tars:
    image: "ghcr.io/allenneuraldynamics/aind-tars-service-server:0.1.5"
    env_file: "env/tars.env"
  dataverse:
    image: "ghcr.io/allenneuraldynamics/aind-dataverse-service-server:0.4.0"
    env_file: "env/dataverse.env"
  active_directory:
    image: "ghcr.io/allenneuraldynamics/aind-active-directory-service-server:0.1.3"
    env_file: "env/active_directory.env"
  aind_metadata_service_v1:
    image: "ghcr.io/allenneuraldynamics/aind-metadata-service-server:1.7.0"
    depends_on:
      - labtracks
      - mgi
      - smartsheet
      - sharepoint
      - tars
      - dataverse
      - redis
    env_file: "env/webapp_v1.env"
  redis:
    image: "redis:latest"
